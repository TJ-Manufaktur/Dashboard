const LS = 'tjm-unlock-v1';
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const e64 = b => { let s = ''; new Uint8Array(b).forEach(x => s += String.fromCharCode(x)); return btoa(s); };
async function open_(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:d64(P.iv)}, key, d64(P.ct));
  const html = new TextDecoder().decode(pt);
  if(document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once:true }));
  setTimeout(() => { document.open(); document.write(html); document.close(); }, 0);
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:d64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
(async () => {
  try {
    const st = JSON.parse(localStorage.getItem(LS) || 'null');
    if(st && st.salt === P.salt){ const k = await crypto.subtle.importKey('raw', d64(st.key), 'AES-GCM', false, ['decrypt']); await open_(k); }
  } catch(e){ try { localStorage.removeItem(LS); } catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), er = document.getElementById('e');
  b.disabled = true; b.textContent = 'Prüfe …'; er.textContent = '';
  try {
    const key = await derive(document.getElementById('pw').value);
    const raw = await crypto.subtle.exportKey('raw', key);
    const dk = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    await crypto.subtle.decrypt({name:'AES-GCM', iv:d64(P.iv)}, dk, d64(P.ct));
    if(document.getElementById('rem').checked){ try { localStorage.setItem(LS, JSON.stringify({salt:P.salt, key:e64(raw)})); } catch(_){} }
    await open_(dk);
  } catch(e){ er.textContent = 'Passwort falsch.'; b.disabled = false; b.textContent = 'Entsperren'; }
});
